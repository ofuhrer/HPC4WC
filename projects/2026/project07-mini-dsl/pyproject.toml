[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yasmin"
version = "0.1.0"
description = "Yet Another Stencil Mini Intermediate Notation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
bench = [
    "gt4py",
    "matplotlib",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12",
    "mypy>=1.15",
    "pre-commit>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "openmp: tests that require an OpenMP-capable compiler",
    "cuda: tests that require a CUDA-capable GPU",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/yasmin"]

[[tool.mypy.overrides]]
module = ["gt4py.*"]
ignore_missing_imports = true
