name: Material checks

on:
  push:
  pull_request:

jobs:
  material:
    name: Day 1 through Day 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran openmpi-bin libopenmpi-dev

      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat ipython numpy click matplotlib codespell ruff==0.13.3

      - name: Check Python formatting
        run: ruff format --check $(git ls-files "day*/.master/*.py" "day*/*.py" "tools/*.py")

      - name: Check course material
        run: PYTHONDONTWRITEBYTECODE=1 python tools/check_material.py
