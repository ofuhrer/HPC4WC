name: Material checks

on:
  push:
  pull_request:

jobs:
  material:
    name: Day 1 and Day 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat ipython numpy click matplotlib ruff==0.13.3

      - name: Check tool formatting
        run: ruff format --check tools

      - name: Check course material
        run: PYTHONDONTWRITEBYTECODE=1 python tools/check_material.py day1 day5
