repos:
  - repo: local
    hooks:
      - id: course-prep-guards
        name: Course prep guards
        entry: python tools/pre_commit_checks.py
        language: system
        pass_filenames: false

      - id: ruff-format-python-material
        name: Ruff format Python material
        entry: bash -c 'ruff format --check $(git ls-files "day*/.master/*.py" "day*/*.py" "tools/*.py")'
        language: python
        additional_dependencies:
          - ruff==0.13.3
        pass_filenames: false
        files: ^(day[1-5]/.*\.py|tools/.*\.py)$
