repos:
  - repo: local
    hooks:
      - id: course-prep-guards
        name: Course prep guards
        entry: python tools/pre_commit_checks.py
        language: system
        pass_filenames: false

      - id: ruff-format-tools
        name: Ruff format tools
        entry: ruff format --check
        language: python
        additional_dependencies:
          - ruff==0.13.3
        files: ^tools/.*\.py$

